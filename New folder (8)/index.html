<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECHNORA'26 — Round 1: Debug Arena | Participant Portal</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/participant.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="tech-grid-bg">

  <div class="portal-container">
    <div class="portal-card glass-panel">
      
      <!-- Symposium Header Branding -->
      <div class="text-center mb-8">
        <div class="symposium-logo-badge mb-3">
          <span class="pulse-center-dot" style="width: 8px; height: 8px;"></span>
          DEPARTMENT OF COMPUTER SCIENCE & ENGINEERING
        </div>
        <h1 class="font-display text-4xl font-bold tracking-tight text-white mb-1">
          TECHNORA<span class="glow-text-cyan">'26</span>
        </h1>
        <div class="font-mono text-sm tracking-widest text-sky-400 font-semibold mb-2">
          ROUND 1 — DEBUG ARENA
        </div>
        <p class="text-slate-400 text-xs font-mono">
          Technical Screening & Code Output Assessment
        </p>
      </div>

      <!-- Participant Login Form -->
      <form id="participant-login-form" class="space-y-5">
        <div>
          <label class="block font-mono text-xs text-sky-300 mb-1.5 uppercase tracking-wider">
            Participant ID
          </label>
          <div class="relative">
            <input 
              type="text" 
              id="input-participant-id" 
              class="tech-input font-mono" 
              placeholder="e.g. TECH001" 
              required
              autocomplete="username"
            >
          </div>
          <p class="text-slate-500 text-[11px] font-mono mt-1">
            Issued by the Technical Symposium Organizing Committee
          </p>
        </div>

        <div>
          <label class="block font-mono text-xs text-sky-300 mb-1.5 uppercase tracking-wider">
            Password
          </label>
          <input 
            type="password" 
            id="input-participant-password" 
            class="tech-input font-mono" 
            placeholder="••••••••" 
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="btn-participant-login" class="btn-cyber-primary w-full py-3 mt-2 text-sm font-bold">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          ENTER DEBUG ARENA
        </button>
      </form>

      <!-- Institutional Notice & Convenor Link -->
      <div class="mt-8 pt-6 border-t border-sky-950 text-center flex flex-col gap-2">
        <a href="leaderboard.html" class="text-xs font-mono text-sky-400 hover:text-sky-300 transition-colors flex items-center justify-center gap-1.5">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          View Live Arena Leaderboard
        </a>
        <div class="text-[11px] font-mono text-slate-500">
          Faculty / Convener? <a href="admin/index.html" class="text-slate-400 hover:text-sky-400 underline underline-offset-2">Admin Control Center</a>
        </div>
      </div>

    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { loginParticipant, showToast } from "./js/auth.js";

    const form = document.getElementById("participant-login-form");
    const submitBtn = document.getElementById("btn-participant-login");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pId = document.getElementById("input-participant-id").value.trim();
      const pass = document.getElementById("input-participant-password").value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-black inline" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
        Authenticating...
      `;

      try {
        await loginParticipant(pId, pass);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          ENTER DEBUG ARENA
        `;
      }
    });
  </script>
</body>
</html>
