<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECHNORA'26 — Round 1: Debug Arena | Participant Portal</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/participant.css">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <script src="js/security.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="tech-grid-bg">

  <div class="cs-wrapper">
    <div class="cs-login-box">
      <!-- Curved Tab Header (CodingStella) -->
      <div class="cs-login-header">
        <span>Login</span>
      </div>

      <!-- Symposium Header -->
      <div class="text-center mb-6">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-amber-400 text-xs font-mono mb-2">
          <span class="w-2 h-2 rounded-full bg-amber-400"></span>
          TECHNORA'26
        </div>
        <h1 class="font-display text-2xl font-bold text-white tracking-wide">
          Debug Arena
        </h1>
        <p class="text-white/60 text-xs font-mono mt-0.5">Round 1 • Technical Screening</p>
      </div>

      <!-- Participant Login Form -->
      <form id="participant-login-form">
        <div class="cs-input-box">
          <input 
            type="text" 
            id="input-participant-id" 
            class="cs-input-field" 
            placeholder=" " 
            required 
            autocomplete="username"
          >
          <label for="input-participant-id" class="cs-label">Team ID / Username</label>
          <i class="bx bx-user cs-icon"></i>
        </div>

        <div class="cs-input-box">
          <input 
            type="password" 
            id="input-participant-password" 
            class="cs-input-field" 
            placeholder=" " 
            required 
            autocomplete="current-password"
          >
          <label for="input-participant-password" class="cs-label">Password</label>
          <i class="bx bx-lock-alt cs-icon"></i>
        </div>

        <div class="cs-remember-forgot">
          <label class="cs-remember-me">
            <input type="checkbox" id="remember-me">
            <span>Remember me</span>
          </label>
          <div class="cs-forgot">
            <a href="leaderboard.html">Live Leaderboard</a>
          </div>
        </div>

        <button type="submit" id="btn-participant-login" class="cs-input-submit">
          <span>ENTER DEBUG ARENA</span>
          <i class="bx bx-right-arrow-alt text-xl"></i>
        </button>

        <div class="cs-register">
          <span>Department of Computer Science &amp; Engineering • TECHNORA'26</span>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { loginParticipant, showToast } from "./js/auth.js";

    const form = document.getElementById("participant-login-form");
    const submitBtn = document.getElementById("btn-participant-login");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pId = document.getElementById("input-participant-id").value.trim();
      const pass = document.getElementById("input-participant-password").value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-black inline" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
        Authenticating...
      `;

      try {
        await loginParticipant(pId, pass);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <span>ENTER DEBUG ARENA</span>
          <i class="bx bx-right-arrow-alt text-xl"></i>
        `;
      }
    });
  </script>
</body>
</html>
